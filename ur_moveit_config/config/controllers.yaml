controller_names:
  - scaled_joint_trajectory_controller
  - joint_trajectory_controller
  # Legacy ros2_control gripper controller; uncomment when switching back.
  # - robotiq_gripper_controller
  - robotiq_2f_urcap_adapter



scaled_joint_trajectory_controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: false
  joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint


joint_trajectory_controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: true
  joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
    
# Legacy ros2_control gripper controller:
# robotiq_gripper_controller:
#     action_ns: gripper_cmd

# URCap adapter (robotiq_2f_urcap_adapter node)
robotiq_2f_urcap_adapter:
    action_ns: gripper_command
    type: GripperCommand
    max_effort: 140.0
    default: false
    joints:
      - robotiq_85_left_knuckle_joint
     
